<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crepería</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./img/favicon.jpg">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
<main class="mx-auto max-w-3xl px-4 py-8">

    <!-- Encabezado -->
    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold tracking-tight">CREPERÍA</h1>
        <p class="mt-2 text-slate-600">
            Deliciosas y exquisitas crepas
        </p>
    </header>

    <!-- Formulario -->
    <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <form id="habitForm" class="space-y-4">

            <!-- Nombre -->
            <div>
                <label for="habitName" class="mb-1 block text-sm font-medium text-slate-700">
                    Producto (untable y relleno)
                </label>
                <input 
                    id="habitName"
                    name="nombre"
                    type="text" 
                    placeholder="Ejemplo: Nutella con fresa"
                    required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
                >
            </div>
            
            <!-- Tipo -->
            <div>
                <label for="habitEnergy" class="mb-1 block text-sm font-medium text-slate-700">
                    Tipo
                </label>

                <select 
                    id="habitEnergy"
                    name="tipo"
                    required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
                >
                    <option value="dulce">DULCE</option>
                    <option value="salada">SALADA</option>
                    <option value="frappe">FRAPPE</option>
                </select>
            </div>

            <!-- Botón -->
            <button 
                type="submit"
                class="w-full rounded-xl bg-slate-900 px-4 py-3 font-medium text-white transition hover:bg-slate-700">
                Agregar producto
            </button>

            <!-- Mensaje -->
            <p id="formMessage" role="alert" class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>

        </form>
    </section>

    <!-- Contadores -->
    <section class="mt-6 grid gap-3 sm:grid-cols-3">
        <article class="rounded-2xl bg-white p-4 text-center shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Total</p>
            <p id="totalCount" class="mt-1 text-2xl font-bold">0</p>
        </article>

        <article class="rounded-2xl bg-white p-4 text-center shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Dulces y Saladas</p>
            <p id="pendingCount" class="mt-1 text-2xl font-bold">0</p>
        </article>

        <article class="rounded-2xl bg-white p-4 text-center shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Frappes</p>
            <p id="doneCount" class="mt-1 text-2xl font-bold">0</p>
        </article>
    </section>

    <!-- Filtros -->
    <section class="mt-6">
        <div class="flex flex-wrap gap-2 items-center justify-center">

            <button 
                type="button"
                data-filter="all"
                class="filter-btn rounded-full border bg-slate-200 border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-300">
                Todos
            </button>

            <button 
                type="button"
                data-filter="dulce"
                class="filter-btn rounded-full border bg-slate-200 border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-300">
                Dulces
            </button>

            <button 
                type="button"
                data-filter="salada"
                class="filter-btn rounded-full border bg-slate-200 border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-300">
                Saladas
            </button>

            <button 
                type="button"
                data-filter="frappe"
                class="filter-btn rounded-full border bg-slate-200 border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-300">
                Frappes
            </button>

        </div>
    </section>

    <!-- Lista -->
    <section class="mt-6">
        <div id="habitList" class="space-y-3"></div>
    </section>

</main>

<script type="module" src="./js/app.js"></script>
</body>
</html>
